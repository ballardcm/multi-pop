name: System release

# Thor, RG DS and the Odin 2 share one release pipeline so the systems check, package and publish the same way. Each system
# keeps its own tools and tests in systems/<system>, and every step runs there because those tools locate the project
# root from their own path and inventory sources with git ls-files relative to it. The working directory is set per job
# because workflow-level defaults cannot read inputs.
on:
  workflow_call:
    inputs:
      system:
        description: thor, rgds or odin2
        required: true
        type: string
      preview:
        description: Build a short-lived preview without publishing
        type: boolean
        default: false

# Pull request builds need only read access; publishing is isolated to a manual run on main.
permissions:
  contents: read

jobs:
  package:
    defaults:
      run:
        working-directory: systems/${{ inputs.system }}
    runs-on: ubuntu-latest
    steps:
      # Keep complete source history available for provenance and the published tag's duplicate check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject an unknown system
        run: |
          case "${{ inputs.system }}" in
            thor|rgds|odin2) ;;
            *) echo "Unknown system: ${{ inputs.system }}" >&2; exit 1 ;;
          esac
      # The artwork, logos, fonts and platform list live once in shared/, and each theme links to them; a link that
      # turns into a copy would let the systems drift apart again.
      - name: Check the themes link their shared assets
        working-directory: .
        run: python3 tools/check-shared-assets.py
      - name: Validate the Thor theme and media tools
        if: inputs.system == 'thor'
        run: |
          python3 tools/check-multi-pop.py
          python3 tools/test-install-multi-pop-media.py
          python3 tools/test-package-release.py
          python3 tools/test-release-version.py
          python3 tools/test-thor-touch.py
          python3 tools/test-thor-startup.py
          python3 tools/test-auto-update.py
          python3 tools/test-steam-library.py
      # RG DS used to run these in a separate check.yml on every push as well; folding them in here keeps one place
      # that decides whether an RG DS change is releasable.
      - name: Check the RG DS theme and updater
        if: inputs.system == 'rgds'
        run: |
          python3 tools/check-rgds.py
          python3 tools/test-auto-update.py
          python3 tools/test-package-release.py
          python3 tools/test-release-version.py
          python3 tools/test-popup-bounds.py
      # The Odin 2 theme runs on the stock frontend, so its checks cover only the theme and its packaging.
      - name: Check the Odin 2 theme
        if: inputs.system == 'odin2'
        run: |
          python3 tools/check-odin2.py
          python3 tools/test-odin2-scripts.py
          python3 tools/test-package-release.py
          python3 tools/test-release-version.py
      - name: Check whitespace in this system's files
        run: git diff --check
      - name: Build requested preview
        if: inputs.preview
        uses: ./.github/actions/package-system
        with:
          system: ${{ inputs.system }}
      - name: Select the preview download and its checksum
        if: inputs.preview
        run: |
          mkdir preview
          cp dist/multi-pop-${{ inputs.system }}-rocknix-*.zip preview/
          cd preview
          sha256sum -- *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: inputs.preview
        with:
          name: multi-pop-${{ inputs.system }}-preview-${{ github.sha }}
          path: systems/${{ inputs.system }}/preview/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    defaults:
      run:
        working-directory: systems/${{ inputs.system }}
    needs: package
    # Merging never publishes: a release goes out only when a maintainer starts the workflow on main, so several
    # merged PRs can be tested together and shipped as one version.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the release downloads
        uses: ./.github/actions/package-system
        with:
          system: ${{ inputs.system }}
      - name: Publish a release from main's current commit
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM: ${{ inputs.system }}
        run: |
          case "$SYSTEM" in
            thor) name="Thor"; notes="Ready-to-install archive for AYN Thor on ROCKNIX 20261001 or 20261101, matching source bundle, and SHA256SUMS. Installation, removal and rollback steps: https://github.com/ballardcm/multi-pop/tree/main/systems/thor#install Other firmware versions require a newly validated frontend." ;;
            odin2) name="Odin 2"; notes="Ready-to-install theme for AYN Odin 2 on ROCKNIX's stock EmulationStation (shown on screen as Single Pop), matching source ZIP, and SHA256SUMS. Installation and removal steps: https://github.com/ballardcm/multi-pop/tree/main/systems/odin2#install" ;;
            rgds) name="RG DS"; notes="Ready-to-install theme for RG DS on ROCKNIX 20261001 or 20261101, matching source ZIP, and SHA256SUMS. See https://github.com/ballardcm/multi-pop/tree/main/systems/rgds#readme for installation, contributor credits, and recovery." ;;
          esac
          label=$(python3 -c 'import sys; sys.path.insert(0, "tools"); from pathlib import Path; from release_version import read_release; print(read_release(Path("."))[1])')
          tag="$SYSTEM-$label"
          # The installed updaters accept only <system>-MM.DD.YY.N, so a worded label such as Transition would publish
          # a release that no device ever sees.
          # The Odin 2 has no updater yet, so it alone may publish a worded Preview label, and that goes out as a
          # prerelease; every other release needs a numbered revision.
          prerelease=false
          if [ "$SYSTEM" = odin2 ] && python3 -c 'import re, sys; sys.exit(not re.fullmatch(r"odin2-\d{2}\.\d{2}\.\d{2}\.Preview", sys.argv[1]))' "$tag"; then
            prerelease=true
          else
            python3 -c 'import re, sys; assert re.fullmatch(r"(thor|rgds|odin2)-\d{2}\.\d{2}\.\d{2}\.\d{1,3}", sys.argv[1]), "Tag " + sys.argv[1] + " would be ignored by the updater; use a numbered revision"' "$tag"
          fi
          # The packaged label must be the one the tag claims, or the device would show a different version.
          packaged=$(unzip -p "dist/multi-pop-$SYSTEM-rocknix-"*.zip "multi-pop-$SYSTEM/version.json" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("display_version", ""))')
          test "$packaged" = "$label" || { echo "Packaged version $packaged does not match $label" >&2; exit 1; }
          # A label is published once. Re-running the same commit is harmless, but a different commit under an
          # existing tag means the daily revision was not incremented.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published=$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null || true)
            if [ "$published" != "$GITHUB_SHA" ]; then
              echo "$tag is already published from ${published:-another commit}; increment the daily revision" >&2
              exit 1
            fi
            echo "Release already exists: $tag"
            exit 0
          fi
          # What changed in this release is written in the PR that prepares it; the standing text follows it.
          if [ -s docs/release-notes.md ]; then
            notes="$(cat docs/release-notes.md)"$'\n\n'"$notes"
          fi
          # Every device publishes into this repository, so none of their releases may become its single Latest release.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Multi Pop $name $label (${GITHUB_SHA:0:12})" \
            --notes "$notes" \
            --latest=false \
            --prerelease="$prerelease" \
            dist/*
          # GitHub always shows one full release as Latest, and with none chosen it picks the newest by commit date, which
          # would be one device's download. The file-less `downloads` entry holds the mark instead and points at every
          # device's releases; marking it again after each publish keeps it there.
          if gh release view downloads --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit downloads --repo "$GITHUB_REPOSITORY" --latest --notes-file ../../.github/downloads-release.md
          else
            gh release create downloads --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Multi Pop downloads: pick your device" --notes-file ../../.github/downloads-release.md
          fi
