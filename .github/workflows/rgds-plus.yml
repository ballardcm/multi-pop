name: RG DS Plus

on:
  pull_request:
    paths:
      - 'systems/rgds/**'
      - '!systems/rgds/docs/**'
      - '!systems/rgds/**/*.md'
      - 'shared/**'
      - 'tools/**'
      - '.github/actions/package-plus/**'
      - '.github/workflows/rgds-plus.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Build a device preview instead of publishing a release (select the branch to test)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rgds-plus-${{ github.event_name }}-${{ inputs.preview && 'preview' || 'release' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-shared-assets.py
      - name: Prepare the pinned native-resolution Plus profile
        run: python3 systems/rgds/tools/prepare-plus-prototype.py systems/rgds/.local/plus-preview --release
      - name: Validate Plus geometry, touch and hardware isolation
        run: |
          python3 systems/rgds/.local/plus-preview/tools/check-rgds.py
          python3 systems/rgds/.local/plus-preview/tools/test-popup-bounds.py
          python3 systems/rgds/tools/test-plus-profile.py systems/rgds/.local/plus-preview
      - run: git diff --check

  inputs:
    needs: package
    if: github.event_name == 'workflow_dispatch' && (inputs.preview || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      # Only this job reads the draft; it never checks out or executes PR code.
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Fetch fixed frontend draft inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download rgds-frontend-plus-20261030-preview1 \
            --repo "$GITHUB_REPOSITORY" --dir inputs \
            --pattern emulationstation-rgds-plus-aarch64 \
            --pattern emulationstation-source-cada856d.tar.gz \
            --pattern SDL2-2.32.10.tar.gz \
            --pattern pugixml-source.tar.gz
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: rgds-plus-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: inputs/*
          if-no-files-found: error
          # Cleanup below removes this after use; one day is the cancellation fallback.
          retention-days: 1
          compression-level: 0

  preview:
    needs: inputs
    if: github.event_name == 'workflow_dispatch' && inputs.preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/package-plus
      - name: Select the preview download and its checksum
        run: |
          mkdir preview
          cp systems/rgds/.local/plus-dist/multi-pop-rgds-plus-rocknix-*.zip preview/
          cd preview
          sha256sum -- *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rgds-plus-preview-${{ github.sha }}
          path: preview/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs: inputs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/package-plus
      - name: Publish the validated frontend and Plus release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          frontend=$(python3 -c 'import json; print(json.load(open("systems/rgds/frontend-build/plus-release.json"))["release_tag"])')
          # Maintainers stage pinned inputs as a draft so PRs can verify them;
          # only this manual main-branch workflow publishes the prerelease.
          if [ "$(gh release view "$frontend" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$frontend" --draft=false --prerelease --latest=false --target "$GITHUB_SHA"
          fi
          label=$(python3 -c 'import sys; sys.path.insert(0,"systems/rgds/tools"); from pathlib import Path; from release_version import read_release; import json,tempfile; p=Path(tempfile.mkdtemp()); (p/"release-version.json").write_text(Path("systems/rgds/release-version-plus.json").read_text()); print(read_release(p)[1])')
          tag="rgds-plus-$label"
          # Plus updaters accept only a numbered tag, so a worded label would publish a release no device installs.
          python3 -c 'import re,sys; assert re.fullmatch(r"rgds-plus-\d{2}\.\d{2}\.\d{2}\.\d{1,3}",sys.argv[1]), "Tag " + sys.argv[1] + " would be ignored by the Plus updater; use a numbered revision"' "$tag"
          packaged=$(unzip -p systems/rgds/.local/plus-dist/multi-pop-rgds-plus-rocknix-*.zip multi-pop-rgds/version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["display_version"])')
          test "$packaged" = "$label"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(git rev-list -n 1 "refs/tags/$tag")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists at another commit. Raise the revision in systems/rgds/release-version-plus.json through a PR."
              exit 1
            fi
            exit 0
          fi
          # Thor and RG DS publish here too, so no device's release is marked as the repository's Latest.
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "Multi Pop RG DS Plus $label" --latest=false \
            --notes-file systems/rgds/docs/rgds-plus-release-notes.md systems/rgds/.local/plus-dist/*
          # GitHub always shows one full release as Latest, and with none chosen it picks the newest by commit date, which
          # would be one device's download. The file-less `downloads` entry holds the mark instead and points at every
          # device's releases; marking it again after each publish keeps it there.
          if gh release view downloads --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit downloads --repo "$GITHUB_REPOSITORY" --latest --notes-file .github/downloads-release.md
          else
            gh release create downloads --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Multi Pop downloads: pick your device" --notes-file .github/downloads-release.md
          fi

  cleanup-inputs:
    needs: [inputs, preview, publish]
    if: always() && needs.inputs.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the consumed temporary input copy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.inputs.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
