name: RG DS

# PRs run checks only. Request a preview explicitly; releases are manual on main.
on:
  pull_request:
    paths:
      - 'systems/rgds/**'
      - '!systems/rgds/docs/**'
      - '!systems/rgds/**/*.md'
      - 'shared/**'
      - 'tools/**'
      - '.github/actions/package-system/**'
      - '.github/workflows/rgds.yml'
      - '.github/workflows/_system-release.yml'
  workflow_dispatch:
    inputs:
      preview:
        description: Build a device preview instead of publishing a release (select the branch to test)
        type: boolean
        default: false

permissions:
  contents: read

# Thor and RG DS releases run independently, but two runs of the same system must not publish over each other.
concurrency:
  group: rgds-${{ github.event_name }}-${{ inputs.preview && 'preview' || 'release' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    # A called workflow can use no more than its caller grants; the publish job itself is still limited to main.
    permissions:
      contents: write
    uses: ./.github/workflows/_system-release.yml
    with:
      system: rgds
      preview: ${{ inputs.preview || false }}
