name: Thor

# Pull requests that touch Thor, the shared release pipeline or the shared-asset check get a checked preview download;
# publishing happens only when a maintainer runs this workflow on main.
on:
  pull_request:
    paths:
      - 'systems/thor/**'
      - 'shared/**'
      - 'tools/**'
      - '.github/workflows/thor.yml'
      - '.github/workflows/_system-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# Thor and RG DS releases run independently, but two runs of the same system must not publish over each other.
concurrency:
  group: thor-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # A called workflow can use no more than its caller grants; the publish job itself is still limited to main.
    permissions:
      contents: write
    uses: ./.github/workflows/_system-release.yml
    with:
      system: thor
