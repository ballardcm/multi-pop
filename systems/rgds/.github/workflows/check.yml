name: Check RG DS prototype
on: [push, pull_request]
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-rgds.py
      - run: python3 tools/test-auto-update.py
      - run: python3 tools/test-package-release.py
      - run: python3 tools/test-popup-bounds.py
