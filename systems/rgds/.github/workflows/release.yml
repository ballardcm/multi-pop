name: Release packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check theme and updater
        run: |
          python3 tools/check-rgds.py
          python3 tools/test-auto-update.py
          python3 tools/test-package-release.py
          python3 tools/test-release-version.py
          python3 tools/test-popup-bounds.py
          git diff --check
      - name: Fetch verified frontend inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch-release-inputs.py
      - name: Build installable and source packages
        run: |
          python3 tools/package-release.py \
            --frontend .local/release-inputs/emulationstation-aarch64 \
            --upstream-source .local/release-inputs/emulationstation-source-cada856d.tar.gz \
            --sdl-source .local/release-inputs/SDL2-2.32.10.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: multi-pop-rgds-downloads-${{ github.event.pull_request.number || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prototype/rgds'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: multi-pop-rgds-downloads-${{ github.sha }}
          path: dist
      - name: Publish reviewed default-branch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA:0:12}"
          version=$(unzip -p dist/multi-pop-rgds-rocknix-*.zip multi-pop-rgds/version.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("display_version", d["version"]))')
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json name > /tmp/published-releases.json
          python3 -c 'import json,sys; names=json.load(open("/tmp/published-releases.json")); needle="version "+sys.argv[1]+" ("; assert not any(needle in x["name"] for x in names), "Date version already published; increment the daily revision"' "$version"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Multi Pop RG DS version $version (${GITHUB_SHA:0:12})" \
            --notes "Ready-to-install theme for RG DS on ROCKNIX 20261001, matching source ZIP, and SHA256SUMS. Date-based public versions retain upgrade compatibility with 0.3.2. See the README for installation, contributor credits, and recovery." \
            dist/*
